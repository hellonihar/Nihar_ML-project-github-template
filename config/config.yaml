# Project Configuration

# Data paths
data:
  raw_path: "./data/raw"
  processed_path: "./data/processed"

# Model parameters
model:
  type: "neural_network"  # or "random_forest", "svm", etc.
  hyperparameters:
    learning_rate: 0.001
    batch_size: 32
    epochs: 100

# Training configuration
training:
  train_test_split: 0.8
  random_seed: 42
  validation_split: 0.1

# Paths
paths:
  models_dir: "./models"
  results_dir: "./results"
  logs_dir: "./results/logs"
